name: E2E

# End-to-end smoke test: build the real `tailor` binary and use it to build sample images with
# Image Customizer (a real, privileged container run), to catch breakage the unit/integration tests
# can't (they use synthetic fixtures and never invoke IC). Images are built but not booted.
#
# Real builds pull the IC image and an Azure Linux base from MCR and run a privileged customize, so
# this is heavier than the unit CI — it lives in its own workflow. Trigger it on main, on PRs, and
# manually; switch to a nightly `schedule:` if the per-PR cost is too high.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-images:
    name: build sample images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Confirm Docker is available
        run: docker version

      - name: Build the tailor binary
        run: cargo build --release --locked -p tailor

      - name: Pure verbs (no engine needed)
        working-directory: e2e
        run: |
          set -euxo pipefail
          BIN="$GITHUB_WORKSPACE/target/release/tailor"
          "$BIN" list
          "$BIN" matrix --format slugs
          "$BIN" validate
          "$BIN" explain appliance -s flavor=net
          "$BIN" render

      - name: Resolve the lockfile (pin base + toolchain digests)
        working-directory: e2e
        run: |
          "$GITHUB_WORKSPACE/target/release/tailor" lock

      - name: Build the images (real Image Customizer run)
        working-directory: e2e
        run: |
          "$GITHUB_WORKSPACE/target/release/tailor" build

      - name: Assert the artifacts were produced and owned by the runner (janitor worked)
        working-directory: e2e
        run: |
          set -euxo pipefail
          # `net` keeps the default cosi output; `min` produces a zstd-compressed raw.
          cosi="artifacts/appliance_net_amd64_cosi.cosi"
          test -s "$cosi" || { echo "missing or empty artifact: $cosi" >&2; exit 1; }
          owner=$(stat -c '%U' "$cosi")
          if [ "$owner" = "root" ]; then
            echo "artifact $cosi is still root-owned (janitor did not run)" >&2
            exit 1
          fi
          echo "ok: $cosi ($(stat -c '%s' "$cosi") bytes, owner $owner)"

          # The compressed artifact: tailor must publish `<slug>.raw.zst` and remove the raw original.
          zst="artifacts/appliance_min_amd64_raw.raw.zst"
          raw="artifacts/appliance_min_amd64_raw.raw"
          test -s "$zst" || { echo "missing or empty compressed artifact: $zst" >&2; exit 1; }
          if [ -e "$raw" ]; then
            echo "uncompressed original $raw was not removed after compression" >&2
            exit 1
          fi
          owner=$(stat -c '%U' "$zst")
          if [ "$owner" = "root" ]; then
            echo "compressed artifact $zst is still root-owned (janitor did not run)" >&2
            exit 1
          fi
          # It must be a real zstd stream: check the magic number, then verify the frame integrity.
          magic=$(head -c 4 "$zst" | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "28b52ffd" ]; then
            echo "compressed artifact $zst is not a zstd stream (magic=$magic)" >&2
            exit 1
          fi
          zstd -t "$zst"
          echo "ok: $zst ($(stat -c '%s' "$zst") bytes, owner $owner, zstd frame verified)"

