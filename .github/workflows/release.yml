name: Release

# Build and publish signed `tailor` release artifacts from the upstream source
# (microsoft/trident, `tools/tailor`). tailor's code lives upstream; this repo is
# only its release-publishing home.
#
# Runs daily to pick up a new upstream version, and on demand. The `check` job
# reads the upstream `tools/tailor/Cargo.toml` version and exits early unless it
# is newer than the latest `v<version>` release here (override with `force`).
#
# Signing identity: these runs are triggered by `schedule`/`workflow_dispatch` on
# the default branch, so the cosign/attestation identity is
# `https://github.com/frhuelsz/tailor/.github/workflows/release.yml@refs/heads/main`
# (see the verification steps in README.md).
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream git ref (branch / tag / SHA) to build from"
        default: "main"
      force:
        description: "Release even if this version already has a release"
        type: boolean
        default: false

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UPSTREAM: microsoft/trident
  # tailor's path within the upstream repository.
  TAILOR_DIR: tools/tailor

jobs:
  check:
    name: check upstream version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - name: Resolve upstream version and whether to release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.inputs.ref || 'main' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          # Resolve the upstream ref to a concrete commit so every job builds the same source.
          sha="$(gh api "repos/${UPSTREAM}/commits/${REF}" --jq '.sha')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Read the [workspace.package] version from the upstream Cargo.toml at that commit.
          gh api "repos/${UPSTREAM}/contents/${TAILOR_DIR}/Cargo.toml?ref=${sha}" \
            --jq '.content' | base64 -d > up_cargo.toml
          version="$(python3 - <<'PY'
          import pathlib, re, sys
          in_wp = False
          for line in pathlib.Path("up_cargo.toml").read_text(encoding="utf-8").splitlines():
              s = line.strip()
              if s.startswith("[") and s.endswith("]"):
                  in_wp = s == "[workspace.package]"
                  continue
              if in_wp:
                  m = re.match(r'^version\s*=\s*"([^"]+)"\s*$', s)
                  if m:
                      print(m.group(1)); break
          else:
              sys.exit("workspace.package version not found in upstream Cargo.toml")
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="v${version}"
          if [ "$FORCE" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Forcing a release of ${tag} from ${UPSTREAM}@${sha}."
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is already released; nothing to do."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is new; building from ${UPSTREAM}@${sha}."
          fi

  build:
    name: build (${{ matrix.target }})
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - name: Check out upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.sha }}
      - name: Force public crates.io
        run: |
          # The monorepo root .cargo/config.toml replaces crates-io with an
          # authenticated Azure DevOps feed; tailor depends only on public crates,
          # so strip that inherited replacement before building.
          set -eux
          cfg=.cargo/config.toml
          [ -f "$cfg" ] || cfg=.cargo/config
          if [ -f "$cfg" ]; then
            awk '
              /^\[source\.crates-io\]/ { skip=1; next }
              /^\[/                    { skip=0 }
              !skip                    { print }
            ' "$cfg" > "$cfg.tailor.tmp"
            mv "$cfg.tailor.tmp" "$cfg"
          fi
      - name: Install musl toolchain
        run: |
          sudo apt-get update || true
          sudo apt-get install -y musl-tools
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache-workspaces: ${{ env.TAILOR_DIR }}
      - name: Build static binary
        working-directory: ${{ env.TAILOR_DIR }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p tailor
      - name: Stage artifact
        working-directory: ${{ env.TAILOR_DIR }}
        run: |
          mkdir -p dist
          install -Dm755 "target/${{ matrix.target }}/release/tailor" "dist/tailor-${{ matrix.target }}"
          ( cd dist && sha256sum "tailor-${{ matrix.target }}" > "tailor-${{ matrix.target }}.sha256" )
      - name: Verify the binary is fully static
        working-directory: ${{ env.TAILOR_DIR }}
        run: |
          BIN="dist/tailor-${{ matrix.target }}"
          file "$BIN"
          file "$BIN" | grep -qE 'static-pie linked|statically linked'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tailor-${{ matrix.target }}
          path: ${{ env.TAILOR_DIR }}/dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream source (for the SBOM)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.sha }}
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lR dist
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release artifacts
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            for suffix in "" ".sha256"; do
              artifact="dist/tailor-${target}${suffix}"
              if [[ ! -f "$artifact" ]]; then
                echo "::error::Missing release artifact: $artifact"
                exit 1
              fi
              cosign sign-blob --yes \
                --output-signature "${artifact}.sig" \
                --output-certificate "${artifact}.pem" \
                --bundle "${artifact}.bundle" \
                "$artifact"
            done
          done
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ env.TAILOR_DIR }}
          format: cyclonedx-json
          output-file: dist/tailor-cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tailor-x86_64-unknown-linux-musl
            dist/tailor-aarch64-unknown-linux-musl
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Built from [`${{ env.UPSTREAM }}`](https://github.com/${{ env.UPSTREAM }}/tree/${{ needs.check.outputs.sha }}/${{ env.TAILOR_DIR }}) at commit `${{ needs.check.outputs.sha }}`.

            Each binary ships a SHA256 checksum, a cosign keyless signature (`.sig`/`.pem`/`.bundle`), a CycloneDX SBOM, and a build-provenance attestation. See the README for verification steps.
          files: |
            dist/*
