name: Docs

# Mirror the upstream tailor docs (microsoft/trident, `tools/tailor/docs`) to this
# repo's GitHub Pages site (MkDocs Material + mike). The Markdown content lives
# upstream; the site chrome (nav, theme, versioning) lives here in
# `.github/docs/mkdocs.yml`.
#
# Runs daily to pick up upstream doc changes, and on demand. Deploys the current
# upstream version as a mike version with the `latest` alias (the default).
#
# Enable Pages once: Settings -> Pages -> Source: "Deploy from a branch" ->
# Branch: gh-pages / (root).
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  UPSTREAM: microsoft/trident
  TAILOR_DIR: tools/tailor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (site config + gh-pages history)
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          fetch-depth: 0
      - name: Check out upstream docs
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          repository: ${{ env.UPSTREAM }}
          ref: main
          sparse-checkout: ${{ env.TAILOR_DIR }}/docs
          path: upstream
      - name: Sync upstream docs into docs/
        run: |
          set -euo pipefail
          rsync -a --delete "upstream/${TAILOR_DIR}/docs/" docs/
          rm -rf upstream
      - name: Read upstream version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${UPSTREAM}/contents/${TAILOR_DIR}/Cargo.toml?ref=main" \
            --jq '.content' | base64 -d > up_cargo.toml
          version="$(python3 - <<'PY'
          import pathlib, re, sys
          in_wp = False
          for line in pathlib.Path("up_cargo.toml").read_text(encoding="utf-8").splitlines():
              s = line.strip()
              if s.startswith("[") and s.endswith("]"):
                  in_wp = s == "[workspace.package]"
                  continue
              if in_wp:
                  m = re.match(r'^version\s*=\s*"([^"]+)"\s*$', s)
                  if m:
                      print(m.group(1)); break
          else:
              sys.exit("workspace.package version not found in upstream Cargo.toml")
          PY
          )"
          # Docs version = the minor line (e.g. 1.2), aliased `latest`.
          echo "version=${version%.*}" >> "$GITHUB_OUTPUT"
          rm -f up_cargo.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install docs toolchain
        run: pip install -r .github/docs/requirements.txt
      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy with mike
        env:
          CONFIG: .github/docs/mkdocs.yml
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mike deploy --push --update-aliases --config-file "$CONFIG" "$VERSION" latest
          mike set-default --push --config-file "$CONFIG" latest
