version: 2
updates:
  # Keep the pinned GitHub Actions in the release/docs workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Keep the docs toolchain (MkDocs Material + mike) current.
  - package-ecosystem: "pip"
    directory: "/.github/docs"
    schedule:
      interval: "weekly"
